name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          merge_base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main_sha" --jq .merge_base_commit.sha)
          test "$merge_base" = "$GITHUB_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build Linux release archives
        run: |
          mkdir -p dist
          for architecture in amd64 arm64; do
            binary="bors_${GITHUB_REF_NAME}_linux_${architecture}"
            GOOS=linux GOARCH="$architecture" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$binary" ./cmd/bors
            tar -czf "dist/${binary}.tar.gz" -C dist "$binary"
            rm "dist/$binary"
          done
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
